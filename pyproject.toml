[project]
name = "gitstat"
version = "0.1.0"
description = "Analyze git repositories from your terminal. Stats, contributors, hotspots, branches, tags. Zero dependencies, pure Python stdlib."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Mahmoud Ahmed" }]

[project.scripts]
gitstat = "gitstat:main"

[tool.pytest.ini_options]
testpaths = ["tests"]